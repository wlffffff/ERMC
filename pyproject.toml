[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ermc
version = "0.1.0"
description = "ERMC algorithm modules for KeyCorridor"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy>=1.23,<2", "torch>=2.1,<2.6", "gym==0.23.1", "gym-minigrid==1.0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ermc*"]
